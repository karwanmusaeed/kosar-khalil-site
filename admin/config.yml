# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: karwanmusaeed/kosar-khalil-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/199cf4c7-d47d-4c7f-a06e-05252f712e04/pkce
  auth_token_endpoint: /sites/199cf4c7-d47d-4c7f-a06e-05252f712e04/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://kosarkhalil.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - name: "site"
        label: "Photos & Collections"
        file: "data/site.json"
        fields:
          - label: "Collections"
            name: "collections"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "ID (english, lowercase, no spaces — e.g. sandstorm)", name: "id", widget: "string" }
              - { label: "Big title — line 1", name: "name1", widget: "string" }
              - { label: "Big title — line 2 (optional)", name: "name2", widget: "string", required: false, default: "" }
              - { label: "Short label (shown in the top bar and under photos)", name: "label", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Right side — line 1", name: "spec1", widget: "string" }
              - { label: "Right side — line 2", name: "spec2", widget: "string" }
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.title}} — ${{fields.price}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "int", min: 1 }
              - { label: "Collection ID (must match one of the Collection IDs above)", name: "collection", widget: "string" }
      - name: "settings"
        label: "Texts & Settings"
        file: "data/settings.json"
        fields:
          - { label: "Site name", name: "siteName", widget: "string" }
          - { label: "Small line above the big title", name: "eyebrow", widget: "string" }
          - { label: "All Photos — title", name: "allTitle", widget: "string" }
          - { label: "All Photos — description", name: "allDesc", widget: "text" }
          - { label: "Black box — small tag", name: "statementTag", widget: "string" }
          - { label: "Black box — heading", name: "statementHeading", widget: "string" }
          - label: "Black box — list of lines"
            name: "statementLines"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
          - { label: "Black box — link text", name: "inquireText", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Behance URL", name: "behance", widget: "string" }
          - { label: "Location (footer, bottom right)", name: "location", widget: "string" }
          - { label: "Copyright line", name: "copyright", widget: "string" }
